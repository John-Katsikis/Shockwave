name: Build

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SDL_AUDIO_DRIVER: dummy
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config \
            libasound2-dev libpulse-dev libpipewire-0.3-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev \
            libxi-dev libxtst-dev libxss-dev libxkbcommon-dev libwayland-dev \
            wayland-protocols libdecor-0-dev libdrm-dev libgbm-dev libegl1-mesa-dev \
            libgl1-mesa-dev libgles2-mesa-dev libdbus-1-dev libibus-1.0-dev \
            libusb-1.0-0-dev liburing-dev libvulkan1 mesa-vulkan-drivers \
            glslang-tools xvfb xauth clang-format
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('**/CMakeLists.txt', 'cmake/**/*.cmake') }}
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Validate sample project
        run: xvfb-run -a build/bin/player --check Games/Sample/Sample.swproject
      - name: Verify generated documentation
        run: |
          xvfb-run -a build/bin/player --schema docs/SceneSchema.md
          xvfb-run -a build/bin/player --input-schema docs/InputSchema.md
          git diff --exit-code docs/

  # macOS (Apple silicon) and Windows: build everything and run the tests that need no
  # GPU. Hosted runners may have no usable Vulkan driver, so the GPU tests and the sample
  # check run too but only report (continue-on-error).
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      SDL_AUDIO_DRIVER: dummy
      CMAKE_GENERATOR: Ninja
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        # MoltenVK and the Vulkan loader run Vulkan on Metal; glslang compiles shaders.
        run: brew install ninja glslang molten-vk vulkan-loader
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('**/CMakeLists.txt', 'cmake/**/*.cmake') }}
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure -LE gpu
      - name: GPU tests and sample check
        continue-on-error: true
        run: |
          ctest --test-dir build --output-on-failure -L gpu
          build/bin/player --check Games/Sample/Sample.swproject

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SDL_AUDIO_DRIVER: dummy
    steps:
      - uses: actions/checkout@v4
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-fetchcontent-${{ hashFiles('**/CMakeLists.txt', 'cmake/**/*.cmake') }}
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure -LE gpu
      - name: GPU tests and sample check
        continue-on-error: true
        run: |
          ctest --test-dir build -C Release --output-on-failure -L gpu
          build/bin/player.exe --check Games/Sample/Sample.swproject
